<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackTrek Express - Railway Reservation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
        }
        .train-icon {
            animation: moveTrain 8s linear infinite;
        }
        @keyframes moveTrain {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(calc(100vw + 100px)); }
        }
        .form-section {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4">
    <div class="max-w-6xl mx-auto">
        <!-- Header Section -->
        <header class="text-center mb-12">
            <div class="flex justify-center items-center mb-4">
                <div class="train-icon text-indigo-600 mr-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3a3 3 0 0 0-3 3v9a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"></path>
                        <path d="M19 9a7 7 0 0 0-14 0"></path>
                        <line x1="12" y1="19" x2="12" y2="21"></line>
                        <line x1="8" y1="19" x2="8" y2="21"></line>
                        <line x1="16" y1="19" x2="16" y2="21"></line>
                    </svg>
                </div>
                <h1 class="text-4xl font-bold text-gray-800">TrackTrek Express</h1>
            </div>
            <p class="text-lg text-gray-600">Book your journey with ease and speed</p>
        </header>

        <!-- Legend Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <fieldset class="border border-gray-200 rounded-lg p-4">
                <legend class="text-xl font-semibold px-2 text-indigo-600">Train Reservation Form</legend>
                
                <!-- Form Content -->
                <form class="space-y-6">
                    <!-- Journey Details -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="from" class="block text-sm font-medium text-gray-700 mb-1">From</label>
                            <div class="relative">
                                <i data-feather="map-pin" class="absolute left-3 top-3 text-gray-400"></i>
                                <select id="from" class="pl-10 w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                    <option value="">Select departure station</option>
                                    <option value="delhi">Delhi Junction</option>
                                    <option value="mumbai">Mumbai Central</option>
                                    <option value="chennai">Chennai Central</option>
                                    <option value="kolkata">Kolkata Howrah</option>
                                    <option value="bangalore">Bangalore City</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label for="to" class="block text-sm font-medium text-gray-700 mb-1">To</label>
                            <div class="relative">
                                <i data-feather="map-pin" class="absolute left-3 top-3 text-gray-400"></i>
                                <select id="to" class="pl-10 w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                    <option value="">Select arrival station</option>
                                    <option value="delhi">Delhi Junction</option>
                                    <option value="mumbai">Mumbai Central</option>
                                    <option value="chennai">Chennai Central</option>
                                    <option value="kolkata">Kolkata Howrah</option>
                                    <option value="bangalore">Bangalore City</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label for="date" class="block text-sm font-medium text-gray-700 mb-1">Date of Journey</label>
                            <div class="relative">
                                <i data-feather="calendar" class="absolute left-3 top-3 text-gray-400"></i>
                                <input type="date" id="date" class="pl-10 w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                        </div>
                        <div>
                            <label for="class" class="block text-sm font-medium text-gray-700 mb-1">Class</label>
                            <div class="relative">
                                <i data-feather="briefcase" class="absolute left-3 top-3 text-gray-400"></i>
                                <select id="class" class="pl-10 w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                    <option value="">Select class</option>
                                    <option value="1ac">1st AC</option>
                                    <option value="2ac">2nd AC</option>
                                    <option value="3ac">3rd AC</option>
                                    <option value="sleeper">Sleeper</option>
                                    <option value="general">General</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label for="quota" class="block text-sm font-medium text-gray-700 mb-1">Quota</label>
                            <div class="relative">
                                <i data-feather="tag" class="absolute left-3 top-3 text-gray-400"></i>
                                <select id="quota" class="pl-10 w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                    <option value="general">General</option>
                                    <option value="ladies">Ladies</option>
                                    <option value="tatkal">Tatkal</option>
                                    <option value="premium">Premium Tatkal</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Passenger Details -->
                    <div class="pt-4 border-t border-gray-200">
                        <h3 class="text-lg font-medium text-gray-900 mb-4">Passenger Details</h3>
                        <div class="space-y-4">
                            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <div class="md:col-span-2">
                                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                                    <input type="text" id="name" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                </div>
                                <div>
                                    <label for="age" class="block text-sm font-medium text-gray-700 mb-1">Age</label>
                                    <input type="number" id="age" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                </div>
                                <div>
                                    <label for="gender" class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
                                    <select id="gender" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                        <option value="male">Male</option>
                                        <option value="female">Female</option>
                                        <option value="other">Other</option>
                                        <option value="unspecified">Prefer not to say</option>
                                    </select>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div>
                                    <label for="mobile" class="block text-sm font-medium text-gray-700 mb-1">Mobile Number</label>
                                    <div class="relative">
                                        <i data-feather="smartphone" class="absolute left-3 top-3 text-gray-400"></i>
                                        <input type="tel" id="mobile" class="pl-10 w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                    </div>
                                </div>
                                <div>
                                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                    <div class="relative">
                                        <i data-feather="mail" class="absolute left-3 top-3 text-gray-400"></i>
                                        <input type="email" id="email" class="pl-10 w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                    </div>
                                </div>
                                <div>
                                    <label for="id-proof" class="block text-sm font-medium text-gray-700 mb-1">ID Proof</label>
                                    <select id="id-proof" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                        <option value="aadhar">Aadhar Card</option>
                                        <option value="pan">PAN Card</option>
                                        <option value="passport">Passport</option>
                                        <option value="voter">Voter ID</option>
                                        <option value="dl">Driving License</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label for="id-number" class="block text-sm font-medium text-gray-700 mb-1">ID Number</label>
                                <input type="text" id="id-number" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                        </div>
                    </div>

                    <!-- Payment Options -->
                    <div class="pt-4 border-t border-gray-200">
                        <h3 class="text-lg font-medium text-gray-900 mb-4">Payment Options</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <label class="flex items-center space-x-3 p-4 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50">
                                <input type="radio" name="payment" class="h-5 w-5 text-indigo-600" checked>
                                <div>
                                    <i data-feather="credit-card" class="text-indigo-600 mb-1"></i>
                                    <span class="block text-sm font-medium text-gray-700">Credit/Debit Card</span>
                                </div>
                            </label>
                            <label class="flex items-center space-x-3 p-4 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50">
                                <input type="radio" name="payment" class="h-5 w-5 text-indigo-600">
                                <div>
                                    <i data-feather="dollar-sign" class="text-indigo-600 mb-1"></i>
                                    <span class="block text-sm font-medium text-gray-700">Net Banking</span>
                                </div>
                            </label>
                            <label class="flex items-center space-x-3 p-4 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50">
                                <input type="radio" name="payment" class="h-5 w-5 text-indigo-600">
                                <div>
                                    <i data-feather="smartphone" class="text-indigo-600 mb-1"></i>
                                    <span class="block text-sm font-medium text-gray-700">UPI Payment</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Terms and Submit -->
                    <div class="flex items-center justify-between pt-6">
                        <div class="flex items-center">
                            <input id="terms" type="checkbox" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                            <label for="terms" class="ml-2 block text-sm text-gray-700">
                                I agree to the <a href="#" class="text-indigo-600 hover:text-indigo-500">terms and conditions</a>
                            </label>
                        </div>
                        <button type="submit" class="px-6 py-3 bg-indigo-600 text-white font-medium rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                            Book Tickets
                        </button>
                    </div>
                </form>
            </fieldset>
        </div>

        <!-- Footer -->
        <footer class="text-center text-gray-500 text-sm mt-12">
            <p>© 2023 TrackTrek Express. All rights reserved.</p>
            <div class="flex justify-center space-x-4 mt-2">
                <a href="#" class="text-indigo-600 hover:text-indigo-800"><i data-feather="twitter"></i></a>
                <a href="#" class="text-indigo-600 hover:text-indigo-800"><i data-feather="facebook"></i></a>
                <a href="#" class="text-indigo-600 hover:text-indigo-800"><i data-feather="instagram"></i></a>
                <a href="#" class="text-indigo-600 hover:text-indigo-800"><i data-feather="linkedin"></i></a>
            </div>
        </footer>
    </div>

    <script>
        feather.replace();
        
        // Simple animation for the train icon
        document.addEventListener('DOMContentLoaded', function() {
            const train = document.querySelector('.train-icon');
            train.style.animationPlayState = 'running';
        });
    </script>
</body>
</html>
